spring:
  application:
    name: orderflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: orderflow
    password: 1234
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway creates tables; Hibernate only checks them
    open-in-view: false
    show-sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info